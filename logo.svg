<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e5a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b8ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon mark -->
  <rect x="0" y="4" width="72" height="72" rx="18" fill="#0d1620"/>
  <rect x="0.5" y="4.5" width="71" height="71" rx="17.5" fill="none" stroke="#1e3048" stroke-width="1"/>

  <!-- Pie chart segments -->
  <circle cx="36" cy="40" r="22" fill="none" stroke="#1e3048" stroke-width="1"/>
  <path d="M36 18 A22 22 0 0 1 57.1 29.5 L36 40 Z" fill="#00e5a0" opacity="0.95" filter="url(#glow)"/>
  <path d="M57.1 29.5 A22 22 0 0 1 57.1 50.5 L36 40 Z" fill="#00b8ff" opacity="0.95"/>
  <path d="M57.1 50.5 A22 22 0 0 1 36 62 L36 40 Z" fill="#ff6b35" opacity="0.9"/>
  <path d="M36 62 A22 22 0 0 1 14.9 50.5 L36 40 Z" fill="#00e5a0" opacity="0.45"/>
  <path d="M14.9 50.5 A22 22 0 0 1 14.9 29.5 L36 40 Z" fill="#00b8ff" opacity="0.45"/>
  <path d="M14.9 29.5 A22 22 0 0 1 36 18 L36 40 Z" fill="#ff6b35" opacity="0.4"/>
  <!-- Center hole -->
  <circle cx="36" cy="40" r="11" fill="#0d1620"/>
  <!-- D letter -->
  <text x="36" y="44.5" text-anchor="middle" font-family="Syne, system-ui, sans-serif" font-weight="800" font-size="13" fill="#00e5a0" filter="url(#glow)">D</text>

  <!-- Wordmark -->
  <text x="86" y="37" font-family="Syne, system-ui, sans-serif" font-weight="800" font-size="22" fill="url(#textGrad)" letter-spacing="-0.5">Dutching</text>
  <text x="87" y="56" font-family="'DM Mono', 'Courier New', monospace" font-weight="400" font-size="11" fill="#6a8aaa" letter-spacing="2.5">CALCULATOR</text>

</svg>
